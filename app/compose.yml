name: maria-app

x-app: &app
  restart: unless-stopped
  networks: [backend]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      DOMAIN: ${DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/admin-allowlist.conf:/etc/nginx/admin-allowlist.conf:ro
      - ${CERT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
    networks: [edge]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  maria:
    <<: *app
    image: ghcr.io/returns-7/maria:${MARIA_TAG}
    mem_limit: 1g
    environment:
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mariadb://${DB_HOST}:3306/ria_admin?characterEncoding=UTF-8
      DB_USERNAME: maria_app
      DB_PASSWORD: ${MARIA_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      EXIM_API_KEY: ${EXIM_API_KEY}
      KIS_APP_KEY: ${KIS_APP_KEY}
      KIS_APP_SECRET: ${KIS_APP_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CI_PEPPER: ${CI_PEPPER}
      RETURNS_SECURITY_URL: http://return-securities:10001
      MYDATA_URL: http://mydata:10002
    networks: [edge, backend]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:10000/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  mydata:
    <<: *app
    image: ghcr.io/returns-7/mydata:${MYDATA_TAG}
    mem_limit: 768m
    environment:
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://${DB_HOST}:5432/mydata
      DB_USERNAME: mydata_app
      DB_PASSWORD: ${MYDATA_DB_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:10002/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  return-securities:
    <<: *app
    image: ghcr.io/returns-7/return-securities:${SECURITIES_TAG}
    mem_limit: 768m
    environment:
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mariadb://${DB_HOST}:3306/securities?characterEncoding=UTF-8
      DB_USERNAME: securities_app
      DB_PASSWORD: ${SECURITIES_DB_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:10001/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  redis:
    <<: *app
    image: redis:7-alpine
    mem_limit: 128m
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      TZ: Asia/Seoul
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  edge:
  backend:
