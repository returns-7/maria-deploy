# 학원 VM 전용 덮어쓰기: docker compose -f compose.yml -f compose.academy.yml up -d
services:
  nginx:
    volumes:
      - ./nginx/templates-academy:/etc/nginx/templates:ro
      - ./react-dist:/usr/share/nginx/html/my:ro
  # 시드 459종목 목록(이미지 기본값은 77종목). 시드가 바뀌면 CSV도 같이 바꾼다
  risk:
    environment:
      RISK_UNIVERSE_PATH: /universe/risk-universe-seed.csv
    volumes:
      - ./risk-universe/risk-universe-seed.csv:/universe/risk-universe-seed.csv:ro
  # 고객 API CORS 허용 출처(기본값 localhost:5173). 브라우저가 이 도메인으로 보내는 POST를 허용한다
  maria:
    environment:
      APP_CUSTOMER_ALLOWED_ORIGINS: https://returns.shinhanacademy.co.kr
