name: maria-db

services:
  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    command: ["--default-time-zone=+09:00"]
    environment:
      TZ: Asia/Seoul
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      # 90_app_users.sh 가 읽는다
      MARIA_DB_PASSWORD: ${MARIA_DB_PASSWORD}
      SECURITIES_DB_PASSWORD: ${SECURITIES_DB_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./init/mariadb:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_BIND_IP}:3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mydata
      # 90_app_user.sh 가 읽는다
      MYDATA_DB_PASSWORD: ${MYDATA_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_BIND_IP}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydata"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mariadb-data:
  postgres-data:
